<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>FlashBooked — Numbers Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Inter+Tight:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0c11;
    --bg-raised: #12151d;
    --border: #212632;
    --text-primary: #f4f6f9;
    --text-secondary: #9aa4b6;
    --accent: #7c7ff2;
    --success: #3ddc9b;
    --success-soft: rgba(61, 220, 155, 0.12);
    --success-border: rgba(61, 220, 155, 0.3);
    --warning: #f5b955;
    --warning-soft: rgba(245, 185, 85, 0.12);
    --warning-border: rgba(245, 185, 85, 0.3);
    --danger: #f2726b;
    --danger-soft: rgba(242, 114, 107, 0.12);
    --danger-border: rgba(242, 114, 107, 0.3);
    --info: #6ba7f7;
    --info-soft: rgba(107, 167, 247, 0.12);
    --info-border: rgba(107, 167, 247, 0.3);
    --radius-sm: 7px;
    --radius-md: 12px;
    --radius-lg: 16px;
    --font-sans: 'Inter', system-ui, sans-serif;
    --font-display: 'Inter Tight', system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text-primary);
    font-family: var(--font-sans);
    -webkit-font-smoothing: antialiased;
  }
  header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: rgba(10, 12, 17, 0.85);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
    padding: 20px 32px;
  }
  header .inner {
    max-width: 1100px;
    margin: 0 auto;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  h1 {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 20px;
    margin: 0;
    letter-spacing: -0.01em;
  }
  .subtitle {
    color: var(--text-secondary);
    font-size: 13px;
    margin-top: 2px;
  }
  #generated {
    font-size: 12px;
    color: var(--text-secondary);
  }
  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 32px;
  }
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 14px;
    margin-bottom: 28px;
  }
  .stat-card {
    background: var(--bg-raised);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 16px 18px;
  }
  .stat-card .label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-secondary);
    font-weight: 600;
    margin-bottom: 6px;
  }
  .stat-card .value {
    font-family: var(--font-display);
    font-size: 26px;
    font-weight: 800;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    background: var(--bg-raised);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    overflow: hidden;
  }
  thead th {
    text-align: left;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-secondary);
    font-weight: 600;
    padding: 12px 18px;
    border-bottom: 1px solid var(--border);
  }
  tbody td {
    padding: 16px 18px;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
    vertical-align: top;
  }
  tbody tr:last-child td { border-bottom: none; }
  .number {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 15px;
    white-space: nowrap;
  }
  .used-by {
    font-weight: 600;
  }
  .note {
    color: var(--text-secondary);
    font-size: 12.5px;
    margin-top: 3px;
  }
  .pill {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 11.5px;
    font-weight: 600;
    white-space: nowrap;
  }
  .pill-green { background: var(--success-soft); color: var(--success); border: 1px solid var(--success-border); }
  .pill-yellow { background: var(--warning-soft); color: var(--warning); border: 1px solid var(--warning-border); }
  .pill-red { background: var(--danger-soft); color: var(--danger); border: 1px solid var(--danger-border); }
  .pill-blue { background: var(--info-soft); color: var(--info); border: 1px solid var(--info-border); }
  .pill-gray { background: rgba(154, 164, 182, 0.12); color: var(--text-secondary); border: 1px solid rgba(154, 164, 182, 0.25); }
  .agent-tag {
    display: inline-block;
    margin-top: 4px;
    font-size: 11.5px;
    color: var(--accent);
  }
  .usage-wrap {
    min-width: 140px;
  }
  .usage-label {
    font-size: 12.5px;
    font-weight: 600;
    margin-bottom: 5px;
  }
  .usage-track {
    height: 6px;
    border-radius: 999px;
    background: rgba(154, 164, 182, 0.15);
    overflow: hidden;
  }
  .usage-fill {
    height: 100%;
    border-radius: 999px;
  }
  .usage-fill.ok { background: var(--success); }
  .usage-fill.warn { background: var(--warning); }
  .usage-fill.over { background: var(--danger); }
  .usage-calls {
    font-size: 11.5px;
    color: var(--text-secondary);
    margin-top: 4px;
  }
  #error {
    background: var(--danger-soft);
    border: 1px solid var(--danger-border);
    color: var(--danger);
    padding: 14px 18px;
    border-radius: var(--radius-md);
    font-size: 13px;
    display: none;
  }
  #loading {
    color: var(--text-secondary);
    font-size: 13px;
    padding: 20px 0;
  }
  .call-btn {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: var(--radius-sm);
    padding: 7px 14px;
    font-family: var(--font-sans);
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  .call-btn:hover { opacity: 0.88; }
  .call-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  #call-panel {
    display: none;
    position: fixed;
    bottom: 20px;
    right: 20px;
    width: 340px;
    max-height: 60vh;
    background: var(--bg-raised);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: 0 12px 40px rgba(0,0,0,0.5);
    z-index: 100;
    display: none;
    flex-direction: column;
    overflow: hidden;
  }
  #call-panel.open { display: flex; }
  .call-panel-header {
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .call-panel-title {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 14px;
  }
  .call-panel-status {
    font-size: 11.5px;
    color: var(--text-secondary);
    margin-top: 2px;
  }
  .call-panel-status.live { color: var(--success); }
  #call-transcript {
    flex: 1;
    overflow-y: auto;
    padding: 12px 16px;
    font-size: 12.5px;
    line-height: 1.5;
  }
  .transcript-line { margin-bottom: 8px; }
  .transcript-line .role {
    font-weight: 700;
    text-transform: uppercase;
    font-size: 10px;
    letter-spacing: 0.05em;
    color: var(--text-secondary);
    display: block;
    margin-bottom: 1px;
  }
  .call-panel-controls {
    padding: 12px 16px;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 8px;
  }
  .call-panel-controls button {
    flex: 1;
    padding: 9px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-primary);
    font-family: var(--font-sans);
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
  }
  .call-panel-controls .hangup {
    background: var(--danger-soft);
    border-color: var(--danger-border);
    color: var(--danger);
  }
  .call-panel-close {
    background: none;
    border: none;
    color: var(--text-secondary);
    cursor: pointer;
    font-size: 18px;
    line-height: 1;
    padding: 0 0 0 8px;
  }
</style>
</head>
<body>

<header>
  <div class="inner">
    <div>
      <h1>FlashBooked — Numbers</h1>
      <div class="subtitle">Which Twilio number goes to which agent, live from Twilio + Retell</div>
    </div>
    <div id="generated"></div>
  </div>
</header>

<main>
  <div id="error"></div>
  <div id="loading">Loading…</div>
  <div id="stats" class="stats-grid" style="display:none"></div>
  <table id="table" style="display:none">
    <thead>
      <tr>
        <th>Number</th>
        <th>Used by</th>
        <th>Status</th>
        <th>Usage this month</th>
        <th>Details</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
</main>

<div id="call-panel">
  <div class="call-panel-header">
    <div>
      <div class="call-panel-title" id="call-panel-title">Calling…</div>
      <div class="call-panel-status" id="call-panel-status">Connecting…</div>
    </div>
    <button class="call-panel-close" onclick="endTestCall()">&times;</button>
  </div>
  <div id="call-transcript"></div>
  <div class="call-panel-controls">
    <button id="mute-btn" onclick="toggleMute()">Mute</button>
    <button class="hangup" onclick="endTestCall()">Hang up</button>
  </div>
</div>

<script>
const STATUS_META = {
  'live-ai-agent':               { label: 'Live — AI agent',       pill: 'pill-green' },
  'retell-registered-not-routed':{ label: 'Registered, not routed', pill: 'pill-yellow' },
  'manual-forward':              { label: 'Manual forward',        pill: 'pill-blue' },
  'unconfigured':                { label: 'Unconfigured',          pill: 'pill-gray' },
  'other':                       { label: 'Other',                 pill: 'pill-gray' },
};

function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function load() {
  try {
    const res = await fetch('/api/numbers-dashboard');
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Request failed');

    document.getElementById('generated').textContent =
      'Updated ' + new Date(data.generatedAt).toLocaleString('en-IE', { dateStyle: 'medium', timeStyle: 'short' });

    const numbers = data.numbers || [];
    const live = numbers.filter(n => n.status === 'live-ai-agent').length;
    const unconfigured = numbers.filter(n => n.status === 'unconfigured').length;

    const stats = document.getElementById('stats');
    stats.innerHTML = `
      <div class="stat-card"><div class="label">Total numbers</div><div class="value">${numbers.length}</div></div>
      <div class="stat-card"><div class="label">Live AI agents</div><div class="value">${live}</div></div>
      <div class="stat-card"><div class="label">Unconfigured</div><div class="value">${unconfigured}</div></div>
    `;
    stats.style.display = 'grid';

    const tbody = document.getElementById('tbody');
    tbody.innerHTML = numbers.map(n => {
      const meta = STATUS_META[n.status] || { label: n.status, pill: 'pill-gray' };
      const usedBy = n.used_by
        ? `<div class="used-by">${escapeHtml(n.used_by)}</div>`
        : `<div class="used-by" style="color:var(--text-secondary);font-weight:400">—</div>`;
      const agentTag = n.retell_agent_id
        ? `<div class="agent-tag">${escapeHtml(n.retell_agent_id)}</div>`
        : '';

      let usageCell = '<span style="color:var(--text-secondary)">—</span>';
      if (n.usage_this_month) {
        const u = n.usage_this_month;
        const pct = Math.min(100, (u.minutes_used / u.included_minutes) * 100);
        const fillClass = u.minutes_used > u.included_minutes ? 'over' : pct >= 70 ? 'warn' : 'ok';
        usageCell = `
          <div class="usage-wrap">
            <div class="usage-label">${u.minutes_used} / ${u.included_minutes} min</div>
            <div class="usage-track"><div class="usage-fill ${fillClass}" style="width:${pct}%"></div></div>
            <div class="usage-calls">${u.calls_this_month} call${u.calls_this_month === 1 ? '' : 's'} this month</div>
          </div>
        `;
      }

      const callBtn = n.retell_agent_id
        ? `<button class="call-btn" onclick="startTestCall('${n.retell_agent_id}', '${escapeHtml(n.used_by || n.phone_number).replace(/'/g, "\\'")}')">Call to test</button>`
        : '';

      return `
        <tr>
          <td class="number">${escapeHtml(n.phone_number)}</td>
          <td>${usedBy}${agentTag}</td>
          <td><span class="pill ${meta.pill}">${meta.label}</span></td>
          <td>${usageCell}</td>
          <td><div class="note">${escapeHtml(n.note || '')}</div></td>
          <td>${callBtn}</td>
        </tr>
      `;
    }).join('');

    document.getElementById('table').style.display = 'table';
    document.getElementById('loading').style.display = 'none';
  } catch (err) {
    const errEl = document.getElementById('error');
    errEl.textContent = 'Failed to load: ' + err.message;
    errEl.style.display = 'block';
    document.getElementById('loading').style.display = 'none';
  }
}

load();
</script>

<script type="module">
// --- In-browser test calling (Retell Web SDK) -----------------------------------------------
// Loaded as an ES module bundle (jsDelivr's +esm) rather than the package's own UMD build,
// which throws "Cannot read properties of undefined (reading 'EventEmitter')" in a plain
// browser script tag — its dist/index.umd.js assumes an external `events` global that only
// exists in a bundler/Node context, not a bare <script src>. The +esm endpoint bundles that
// dependency in properly.
import { RetellWebClient } from "https://cdn.jsdelivr.net/npm/retell-client-js-sdk/+esm";

const retellClient = new RetellWebClient();
let isMuted = false;

retellClient.on('call_started', () => {
  document.getElementById('call-panel-status').textContent = 'Live — mic is on';
  document.getElementById('call-panel-status').classList.add('live');
});

retellClient.on('update', (update) => {
  const el = document.getElementById('call-transcript');
  if (!update.transcript || !update.transcript.length) return;
  el.innerHTML = update.transcript.map(t => `
    <div class="transcript-line">
      <span class="role">${escapeHtml(t.role)}</span>${escapeHtml(t.content)}
    </div>
  `).join('');
  el.scrollTop = el.scrollHeight;
});

retellClient.on('call_ended', () => {
  document.getElementById('call-panel-status').textContent = 'Call ended';
  document.getElementById('call-panel-status').classList.remove('live');
});

retellClient.on('error', (err) => {
  document.getElementById('call-panel-status').textContent = 'Error: ' + err;
  document.getElementById('call-panel-status').classList.remove('live');
});

async function startTestCall(agentId, label) {
  const panel = document.getElementById('call-panel');
  document.getElementById('call-panel-title').textContent = label;
  document.getElementById('call-panel-status').textContent = 'Connecting…';
  document.getElementById('call-panel-status').classList.remove('live');
  document.getElementById('call-transcript').innerHTML = '';
  document.getElementById('mute-btn').textContent = 'Mute';
  isMuted = false;
  panel.classList.add('open');

  // Request the mic explicitly, synchronously in the click handler, before anything else —
  // some browsers only honor a getUserMedia prompt within the original click's "user gesture"
  // window, and it can silently fail (agent audio still plays, but your mic never gets
  // captured) if that request happens after an awaited network call instead. Every prior test
  // call showed this exact symptom: the agent's greeting played fine, but zero words of the
  // caller's speech ever reached Retell.
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    stream.getTracks().forEach(t => t.stop()); // just proving access — the SDK opens its own track
  } catch (err) {
    document.getElementById('call-panel-status').textContent =
      'Microphone access denied or blocked — check your browser\'s site permissions and try again.';
    return;
  }

  try {
    const res = await fetch('/api/create-web-call', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ agent_id: agentId }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Failed to create call');

    await retellClient.startCall({ accessToken: data.access_token });
  } catch (err) {
    document.getElementById('call-panel-status').textContent = 'Failed: ' + err.message;
  }
}

function endTestCall() {
  try { retellClient.stopCall(); } catch (e) {}
  document.getElementById('call-panel').classList.remove('open');
}

function toggleMute() {
  isMuted = !isMuted;
  if (isMuted) { retellClient.mute(); } else { retellClient.unmute(); }
  document.getElementById('mute-btn').textContent = isMuted ? 'Unmute' : 'Mute';
}

// Module-scope declarations aren't implicitly global — the inline onclick="" handlers in the
// table rows and call panel need these attached to window explicitly.
window.startTestCall = startTestCall;
window.endTestCall = endTestCall;
window.toggleMute = toggleMute;
</script>

</body>
</html>
