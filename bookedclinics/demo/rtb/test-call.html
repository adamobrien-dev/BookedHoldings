<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RTB Spa — Test Call</title>
<style>
body{font-family:system-ui,sans-serif;background:#faf8f4;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;padding:20px;box-sizing:border-box}
.box{background:#fff;border-radius:16px;padding:40px;max-width:400px;width:100%;box-shadow:0 4px 24px rgba(0,0,0,0.08)}
h2{margin:0 0 6px;font-size:1.3rem;color:#2c2822}
p{margin:0 0 24px;font-size:0.9rem;color:#6b5f55}
label{display:block;font-size:0.82rem;font-weight:600;color:#2c2822;margin-bottom:5px}
input{width:100%;padding:12px 14px;border:1.5px solid #e0d9d0;border-radius:9px;font-size:1rem;font-family:inherit;outline:none;box-sizing:border-box;margin-bottom:16px}
input:focus{border-color:#6b7f5a}
button{width:100%;padding:14px;background:#2c2822;color:#fff;border:none;border-radius:10px;font-size:1rem;font-weight:600;cursor:pointer;font-family:inherit}
button:hover{background:#3d3530}
button:disabled{opacity:0.5;cursor:not-allowed}
.msg{margin-top:16px;padding:14px;border-radius:10px;font-size:0.9rem;display:none}
.ok{background:#f0f5eb;color:#3a5228;border:1px solid #c8d9b5}
.err{background:#fdf0ee;color:#7a3028;border:1px solid #f0c4be}
</style>
</head>
<body>
<div class="box">
  <h2>RTB Spa — Test Call</h2>
  <p>Maya will call the number below as if she's following up on a new lead.</p>

  <label>From number (your Bland.ai number)</label>
  <input type="tel" id="from" value="+17786553757">

  <label>Call this number</label>
  <input type="tel" id="phone" placeholder="+17135556789">

  <label>First name to greet</label>
  <input type="text" id="name" value="Stephanie">

  <button id="btn" onclick="call()">Call now</button>
  <div class="msg" id="msg"></div>
</div>

<script>
const BLAND_KEY = 'org_1c8afa05088719a61da277d3364429f9c3bc28df73bbeff6944ccd82d8bcc8820a78c511da88d39a82ba69';

async function call() {
  const from  = document.getElementById('from').value.trim();
  const phone = document.getElementById('phone').value.trim();
  const name  = document.getElementById('name').value.trim() || 'there';
  const btn   = document.getElementById('btn');

  if (!phone) { show('err', 'Enter a phone number to call.'); return; }

  btn.disabled = true;
  btn.textContent = 'Calling…';

  const task = `You are Maya, a warm and friendly booking coordinator for RTB Spa in West Houston.

You are calling ${name} because they recently inquired about massage services. Your one job on this call is to get them booked in for a massage with Stephanie.

## How to speak
Warm, relaxed, natural. Like you're calling a friend, not reading from a script. Short sentences. Let them respond.

## Call flow
1. Open with: "Hi, is this ${name}? Hey! This is Maya calling from RTB Spa. You recently reached out about our massage services and I just wanted to personally follow up — do you have just a quick second?"
2. Confirm what they're looking for: "Are you looking for something more relaxing, or do you have tension in a specific area you want worked on?"
3. Based on their answer, recommend one of these naturally:
   - Stress / general: Swedish massage or the Relaxation Reset
   - Tight muscles / pain: Deep tissue or Focused Relief massage
   - Neck / shoulders / jaw: Scalp and neck massage or the Jaw Tension session
   - Post-surgery or swelling: Manual Lymphatic Drainage
4. Say: "Stephanie is amazing — she's been doing this for almost 10 years. I'd love to get you in with her. Do mornings or afternoons tend to work better for you?"
5. Pick a specific slot: "She actually has some availability this week. Would [Tuesday at 2pm] or [Thursday at 11am] work for you?" — use realistic-sounding times.
6. Confirm the booking: "Perfect, I'll get that locked in for you. You'll get a confirmation text from us shortly. Is there anything else before I let you go?"
7. Close warmly: "Amazing — we'll see you then. Stephanie is going to take great care of you."

## Rules
- Stay focused on booking a massage. Do not list all services unprompted.
- Never say "demo", "test", or "simulation".
- If they ask about price, say "Sessions start around $95 and go up from there depending on the service — Stephanie will go over everything when you come in."
- Keep the call under 3 minutes.`;

  try {
    const res = await fetch('https://api.bland.ai/v1/calls', {
      method: 'POST',
      headers: { Authorization: BLAND_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({
        phone_number: phone,
        from: from || null,
        task,
        model: 'enhanced',
        language: 'en',
        voice: 'maya',
        first_sentence: `Hi, is this ${name}?`,
        wait_for_greeting: true,
        record: true,
      }),
    });

    const data = await res.json();

    if (!res.ok) {
      show('err', data.message || data.error || 'Call failed — check the phone numbers.');
      btn.disabled = false;
      btn.textContent = 'Call now';
    } else {
      show('ok', `✓ Maya is calling now — pick up!`);
      btn.textContent = 'Call sent!';
    }
  } catch (e) {
    show('err', 'Network error: ' + e.message);
    btn.disabled = false;
    btn.textContent = 'Call now';
  }
}

function show(type, text) {
  const el = document.getElementById('msg');
  el.className = 'msg ' + type;
  el.textContent = text;
  el.style.display = 'block';
}
</script>
</body>
</html>
